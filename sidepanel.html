<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 10px;
      margin: 0;
      background: #f8f9fa;
      color: #202124;
    }
    .header { margin-bottom: 12px; }
    .header-top {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    h2 { margin: 0; font-size: 13px; font-weight: 600; }
    
    /* CHAVINHA LIGA/DESLIGA */
    .switch { position: relative; display: inline-block; width: 30px; height: 16px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 16px; }
    .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #34a853; }
    input:checked + .slider:before { transform: translateX(14px); }

    /* BOTÕES DO TOPO */
    .header-buttons { display: flex; gap: 4px; }
    .btn-top { border: none; border-radius: 3px; padding: 3px 6px; font-size: 9px; font-weight: 600; cursor: pointer; transition: background 0.2s; color: white; }
    #export-btn { background: #1a73e8; }
    #export-btn:hover { background: #1557b0; }
    #clear-btn { background: #ea4335; }
    #clear-btn:hover { background: #d33426; }
    
    /* CAMPO DE NOTA MANUAL */
    .add-note-container { display: flex; gap: 6px; margin-bottom: 12px; }
    #note-input { flex: 1; font-family: inherit; font-size: 11px; padding: 6px; border: 1px solid #dadce0; border-radius: 4px; resize: vertical; min-height: 26px; box-sizing: border-box; outline: none; }
    #note-input:focus { border-color: #1a73e8; }
    #add-note-btn { background: #34a853; color: white; border: none; border-radius: 4px; padding: 0 10px; cursor: pointer; font-size: 11px; font-weight: 600; transition: background 0.2s; }
    #add-note-btn:hover { background: #2b8c45; }

    /* LISTA E ITENS */
    .item { background: #ffffff; padding: 8px; margin-bottom: 8px; border: 1px solid #dadce0; border-radius: 5px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); transition: all 0.2s ease; display: flex; flex-direction: row; align-items: stretch; gap: 8px; }
    .item:hover { border-color: #1a73e8; box-shadow: 0 2px 4px rgba(26,115,232,0.1); }
    .item-text { flex: 1; min-width: 0; font-size: 11px; line-height: 1.35; word-break: break-word; cursor: pointer; padding: 2px; border-radius: 3px; transition: background 0.2s; }
    .item-text:hover { background: #f1f3f4; }
    .edit-textarea { width: 100%; height: 100%; min-height: 60px; font-family: inherit; font-size: 11px; padding: 4px; border: 1px solid #1a73e8; border-radius: 3px; resize: vertical; box-sizing: border-box; outline: none; }
    
    /* BOTÕES LATERAIS DOS ITENS */
    .item-actions { display: flex; flex-direction: column; gap: 4px; padding-left: 6px; border-left: 1px solid #f1f3f4; justify-content: flex-start; min-width: 52px; }
    .action-btn { background: #f1f3f4; border: none; border-radius: 3px; color: #3c4043; font-size: 9px; font-weight: 600; padding: 3px 2px; cursor: pointer; transition: all 0.2s; width: 100%; text-align: center; }
    .action-btn:hover:not(:disabled) { background: #e8eaed; color: #1a73e8; }
    .action-btn.delete { color: #ea4335; }
    .action-btn.delete:hover { background: #fce8e6; }
    
    .empty { color: #5f6368; font-size: 11px; text-align: center; padding: 25px 10px; }

    /* TOAST (NOTIFICAÇÃO) */
    .toast { visibility: hidden; min-width: 130px; background-color: #323232; color: #fff; text-align: center; border-radius: 4px; padding: 6px 12px; position: fixed; z-index: 1000; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 11px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
    .toast.show { visibility: visible; opacity: 1; bottom: 25px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h2>Área de Transferência</h2>
      <label class="switch" title="Ligar/Desligar captura de texto">
        <input type="checkbox" id="capture-toggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="header-buttons">
      <button id="export-btn" class="btn-top" title="Salvar histórico em TXT">📥 Exportar</button>
      <button id="clear-btn" class="btn-top" title="Apagar tudo">🗑️ Limpar</button>
    </div>
  </div>

  <div class="add-note-container">
    <textarea id="note-input" placeholder="Digite ou cole uma nota..." rows="1"></textarea>
    <button id="add-note-btn" title="Adicionar nota">Adicionar</button>
  </div>

  <div id="list"></div>
  <div id="toast" class="toast">Texto copiado!</div>

  <script src="sidepanel.js"></script>
</body>
</html>
